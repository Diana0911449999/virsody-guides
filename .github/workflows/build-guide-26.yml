name: Build multilingual guide 26

on:
  push:
    branches: [main]
    paths:
      - generate_multilang_26.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_26.py --generate-audio
      - name: Remove temporary narration sources
        run: rm -f narration-26-*.txt narration-26-*.srt
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 26.html languages-26.js narration-26-*.mp3 poster-26.jpg
          git commit -m "Add multilingual guide 26"
          git push
