name: Build multilingual guide 27
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_27.py
      - 27-formal.html
      - poster-27-source.jpg
      - .github/workflows/build-guide-27.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_27.py
      - name: Remove temporary narration sources
        run: rm -f narration-27-*.txt narration-27-*.srt poster-27-source.jpg 27-formal.html generate_multilang_27.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 27.html languages-27.js narration-27-*.mp3 poster-27.jpg
          git commit -m "Add multilingual guide 27"
          git push
