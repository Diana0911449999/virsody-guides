name: Build multilingual guide 28
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_28.py
      - 28-formal.html
      - poster-28-source.jpg
      - .github/workflows/build-guide-28.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_28.py
      - name: Remove temporary narration sources
        run: rm -f narration-28-*.txt narration-28-*.srt poster-28-source.jpg 28-formal.html generate_multilang_28.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 28.html languages-28.js narration-28-*.mp3 poster-28.jpg
          git commit -m "Add multilingual guide 28"
          git push
