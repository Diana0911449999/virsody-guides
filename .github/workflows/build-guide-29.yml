name: Build multilingual guide 29
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_29.py
      - 29-formal.html
      - poster-29-source.jpg
      - .github/workflows/build-guide-29.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_29.py
      - name: Remove temporary narration sources
        run: rm -f narration-29-*.txt narration-29-*.srt poster-29-source.jpg 29-formal.html generate_multilang_29.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 29.html languages-29.js narration-29-*.mp3 poster-29.jpg
          git commit -m "Add multilingual guide 29"
          git push
