name: Build multilingual guide 30
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_30.py
      - 30-formal.html
      - poster-30-source.jpg
      - .github/workflows/build-guide-30.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_30.py
      - name: Remove temporary narration sources
        run: rm -f narration-30-*.txt narration-30-*.srt poster-30-source.jpg 30-formal.html generate_multilang_30.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 30.html languages-30.js narration-30-*.mp3 poster-30.jpg
          git commit -m "Add multilingual guide 30"
          git push
