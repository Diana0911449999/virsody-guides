name: Build multilingual guide 31
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_31.py
      - 31-formal.html
      - poster-31-source.jpg
      - .github/workflows/build-guide-31.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_31.py
      - name: Remove temporary narration sources
        run: rm -f narration-31-*.txt narration-31-*.srt poster-31-source.jpg 31-formal.html generate_multilang_31.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 31.html languages-31.js narration-31-*.mp3 poster-31.jpg
          git commit -m "Add multilingual guide 31"
          git push
