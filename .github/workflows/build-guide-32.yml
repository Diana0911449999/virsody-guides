name: Build multilingual guide 32
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_32.py
      - 32-formal.html
      - poster-32-source.jpg
      - .github/workflows/build-guide-32.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_32.py
      - name: Remove temporary narration sources
        run: rm -f narration-32-*.txt narration-32-*.srt poster-32-source.jpg 32-formal.html generate_multilang_32.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 32.html languages-32.js narration-32-*.mp3 poster-32.jpg
          git commit -m "Add multilingual guide 32"
          git push
