name: Build multilingual guide 33
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_33.py
      - 33-formal.html
      - poster-33-source.jpg
      - .github/workflows/build-guide-33.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_33.py
      - name: Remove temporary narration sources
        run: rm -f narration-33-*.txt narration-33-*.srt poster-33-source.jpg 33-formal.html generate_multilang_33.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 33.html languages-33.js narration-33-*.mp3 poster-33.jpg
          git commit -m "Add multilingual guide 33"
          git push
