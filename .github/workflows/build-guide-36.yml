name: Build multilingual guide 36
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_36.py
      - 36-formal.html
      - poster-36-source.jpg
      - .github/workflows/build-guide-36.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_36.py
      - name: Remove temporary narration sources
        run: rm -f narration-36-*.txt narration-36-*.srt poster-36-source.jpg 36-formal.html generate_multilang_36.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 36.html languages-36.js narration-36-*.mp3 poster-36.jpg
          git commit -m "Add multilingual guide 36"
          git push
