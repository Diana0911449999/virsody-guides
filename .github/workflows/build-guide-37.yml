name: Build multilingual guide 37
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_37.py
      - 37-formal.html
      - poster-37-source.jpg
      - .github/workflows/build-guide-37.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_37.py
      - name: Remove temporary narration sources
        run: rm -f narration-37-*.txt narration-37-*.srt poster-37-source.jpg 37-formal.html generate_multilang_37.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 37.html languages-37.js narration-37-*.mp3 poster-37.jpg
          git commit -m "Add multilingual guide 37"
          git push
