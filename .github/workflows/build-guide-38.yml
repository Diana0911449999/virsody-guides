name: Build multilingual guide 38
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_38.py
      - 38-formal.html
      - poster-38-source.jpg
      - .github/workflows/build-guide-38.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_38.py
      - name: Remove temporary narration sources
        run: rm -f narration-38-*.txt narration-38-*.srt poster-38-source.jpg 38-formal.html generate_multilang_38.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 38.html languages-38.js narration-38-*.mp3 poster-38.jpg
          git commit -m "Add multilingual guide 38"
          git push
