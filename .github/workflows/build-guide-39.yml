name: Build multilingual guide 39
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_39.py
      - 39-formal.html
      - poster-39-source.jpg
      - .github/workflows/build-guide-39.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_39.py
      - name: Remove temporary narration sources
        run: rm -f narration-39-*.txt narration-39-*.srt poster-39-source.jpg 39-formal.html generate_multilang_39.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 39.html languages-39.js narration-39-*.mp3 poster-39.jpg
          git commit -m "Add multilingual guide 39"
          git push
