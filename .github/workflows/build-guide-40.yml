name: Build multilingual guide 40
on:
  push:
    branches: [main]
    paths:
      - generate_multilang_40.py
      - 40-formal.html
      - poster-40-source.jpg
      - .github/workflows/build-guide-40.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Generate audio, subtitles, and page
        run: python generate_multilang_40.py
      - name: Remove temporary narration sources
        run: rm -f narration-40-*.txt narration-40-*.srt poster-40-source.jpg 40-formal.html generate_multilang_40.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 40.html languages-40.js narration-40-*.mp3 poster-40.jpg
          git commit -m "Add multilingual guide 40"
          git push
