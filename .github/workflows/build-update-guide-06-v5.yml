name: Smooth guide 06 EMI pronunciation and format Chinese subtitle
on:
  push:
    branches: [main]
    paths:
      - generate_update_06_v5.py
      - .github/workflows/build-update-guide-06-v5.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Regenerate Chinese audio and subtitles
        run: python generate_update_06_v5.py
      - name: Remove temporary sources
        run: rm -f narration-06-zh-TW.txt narration-06-zh-TW.srt
      - name: Commit corrected guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 06.html languages-06.js narration-06-zh-TW.mp3
          git commit -m "Smooth guide 06 EMI pronunciation"
          git push
