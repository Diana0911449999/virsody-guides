name: Correct multilingual guide 19 internship wording
on:
  push:
    branches: [main]
    paths:
      - generate_update_19.py
      - .github/workflows/build-update-guide-19.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Regenerate corrected audio and subtitles
        run: python generate_update_19.py
      - name: Remove temporary sources
        run: rm -f narration-19-*.txt narration-19-*.srt
      - name: Commit corrected guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 19.html languages-19.js narration-19-*.mp3
          git commit -m "Correct guide 19 internship wording"
          git push
