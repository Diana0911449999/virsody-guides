name: Update multilingual guide 23 poster and second theme
on:
  push:
    branches: [main]
    paths:
      - generate_update_23.py
      - .github/workflows/build-update-guide-23.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Regenerate updated audio and subtitles
        run: python generate_update_23.py
      - name: Remove temporary sources
        run: rm -f narration-23-*.txt narration-23-*.srt
      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 23.html languages-23.js narration-23-*.mp3
          git commit -m "Update guide 23 poster topic narration"
          git push
