name: Correct multilingual guide 25 pronunciation
on:
  push:
    branches: [main]
    paths:
      - generate_update_25.py
      - .github/workflows/build-update-guide-25.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Regenerate corrected audio and subtitles
        run: python generate_update_25.py
      - name: Remove temporary sources
        run: rm -f narration-25-*.txt narration-25-*.srt generate_update_25.py
      - name: Commit corrected guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 25.html languages-25.js narration-25-*.mp3
          git commit -m "Correct guide 25 TAICA pronunciation"
          git push
