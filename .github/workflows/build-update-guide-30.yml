name: Update multilingual guide 30
on:
  push:
    branches: [main]
    paths:
      - generate_update_30.py
      - poster-30-source.png
      - .github/workflows/build-update-guide-30.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator
        run: python -m pip install edge-tts
      - name: Update poster, audio, subtitles, and page
        run: python generate_update_30.py
      - name: Remove temporary sources
        run: rm -f narration-30-*.txt narration-30-*.srt poster-30-source.png generate_update_30.py
      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 30.html languages-30.js narration-30-*.mp3 poster-30.png
          git commit -m "Update guide 30 poster and topic"
          git push
