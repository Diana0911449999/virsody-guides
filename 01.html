<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>系所補助方案｜語音導覽</title>
  <style>
    :root{--ink:#edf8fa;--muted:#b8ced3;--panel:rgba(8,32,39,.94);--accent:#60d5e6}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{color:var(--ink);background:radial-gradient(circle at 12% 12%,rgba(47,180,201,.22),transparent 32rem),linear-gradient(145deg,#06171c,#0a262e 54%,#07191e);font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif}.shell{min-height:100vh;padding:clamp(12px,3vw,40px);display:grid;place-items:center}.card{width:min(1180px,100%);display:grid;grid-template-columns:minmax(280px,.86fr) minmax(320px,1.14fr);gap:clamp(22px,4vw,56px);align-items:center;padding:clamp(18px,3vw,38px);border:1px solid rgba(166,230,238,.22);border-radius:26px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.38)}.poster{overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 16px 42px rgba(0,0,0,.32)}.poster img{width:100%;height:auto;display:block}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:.9rem;font-weight:700;letter-spacing:.14em}h1{margin:0;font-size:clamp(2rem,5vw,4.1rem);line-height:1.08}.intro{margin:18px 0 24px;color:var(--muted);font-size:clamp(1rem,1.5vw,1.16rem);line-height:1.7}.subtitle{min-height:7.5rem;display:grid;place-items:center;padding:20px 24px;border-left:5px solid #2fb4c9;border-radius:10px;background:rgba(255,255,255,.075);font-size:clamp(1.2rem,2.4vw,1.72rem);line-height:1.6;text-align:center}.controls{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:14px 18px;align-items:center}.play{width:62px;height:62px;border:0;border-radius:50%;color:#042027;background:var(--accent);cursor:pointer;font-size:1.4rem;box-shadow:0 8px 28px rgba(47,180,201,.3)}.play:focus-visible{outline:3px solid #fff;outline-offset:4px}.progress{display:grid;gap:7px}.progress input{width:100%;accent-color:#2fb4c9}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.86rem}.hint{grid-column:1/-1;margin:0;color:var(--muted);font-size:.88rem}@media(max-width:760px){.card{grid-template-columns:1fr;border-radius:18px}.poster{width:min(520px,100%);margin:auto}.copy{text-align:center}.subtitle{min-height:6.8rem}.controls{text-align:left}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <figure class="poster"><img src="poster-01.jpg" alt="系所補助方案成果展板"></figure>
      <div class="copy">
        <p class="eyebrow">高等教育深耕計畫成果展 · 01</p>
        <h1 id="title">系所補助方案</h1>
        <p class="intro">點選播放按鈕，即可一邊觀看展板，一邊收聽導覽並閱讀同步字幕。</p>
        <div id="subtitle" class="subtitle" aria-live="polite">點選下方按鈕開始語音導覽。</div>
        <audio id="audio" preload="metadata" src="narration-01.mp3"></audio>
        <audio id="outro" preload="metadata" src="outro-01.mp3"></audio>
        <div class="controls">
          <button id="play" class="play" type="button" aria-label="播放導覽">▶</button>
          <div class="progress">
            <input id="seek" type="range" min="0" max="72.65" step="0.05" value="0" aria-label="導覽播放進度">
            <div class="times"><span id="now">0:00</span><span id="total">1:12</span></div>
          </div>
          <p class="hint">若瀏覽器未自動播放聲音，請再點一次播放按鈕。</p>
        </div>
      </div>
    </section>
  </main>
  <script>
  const cues=[
    [0.1,4.313,"歡迎參觀高等教育深耕計畫成果展。"],
    [4.263,13,"本展板介紹「系所補助方案」，透過三項推動計畫，強化學生與教師的專業實務能力。"],
    [13,16.855,"第一項是「創新創業家返校日」。"],
    [16.855,25.46,"透過畢業系友與業界專家返校分享創新經驗，幫助學生掌握職涯趨勢與產業思維。"],
    [25.46,29.907,"六場次活動，累計三百六十人次參與。"],
    [29.907,33.486,"第二項是「專業證照輔導班」。"],
    [33.486,40.644,"學校對接產業需求，開設資訊安全、行銷企劃等證照輔導課程。"],
    [40.644,47.684,"共補助七班次、二百二十九名學生修課，其中七十九人取得證照。"],
    [47.684,51.486,"第三項是「師生專業證照補助」。"],
    [51.486,57.013,"透過經費支持，鼓勵師生取得產業認可的專業證照。"],
    [57.013,62.513,"共補助二百九十九人，並有一百四十三人順利取證。"],
    [62.513,72.578,"這些措施將專業課程、產業實務與證照能力緊密串聯，持續提升學生的職場適應力與就業競爭力。"],
    [72.578,77.483,"以上是系所補助方案的介紹，感謝您的聆聽。"]
  ];
  const audio=document.getElementById('audio'),outro=document.getElementById('outro'),play=document.getElementById('play'),seek=document.getElementById('seek'),sub=document.getElementById('subtitle'),now=document.getElementById('now'),total=document.getElementById('total');
  let phase='main';
  const fmt=v=>`${Math.floor(v/60)}:${String(Math.floor(v%60)).padStart(2,'0')}`;
  const duration=()=>Number.isFinite(audio.duration)&&Number.isFinite(outro.duration)?audio.duration+outro.duration:77.483;
  const update=t=>{seek.max=duration();seek.value=t;now.textContent=fmt(t);total.textContent=fmt(duration());const cue=cues.find(c=>t>=c[0]&&t<=c[1]);sub.textContent=cue?cue[2]:(t>=duration()?'感謝您的聆聽。':'點選下方按鈕開始語音導覽。')};
  play.onclick=async()=>{const active=phase==='main'?audio:outro;active.paused?active.play():active.pause()};
  seek.oninput=()=>{const t=Number(seek.value);if(t<=audio.duration){phase='main';outro.pause();audio.currentTime=t}else{phase='outro';audio.pause();audio.currentTime=audio.duration;outro.currentTime=t-audio.duration}update(t)};
  audio.onplay=()=>{play.textContent='Ⅱ';play.setAttribute('aria-label','暫停導覽')};
  audio.onpause=()=>{play.textContent='▶';play.setAttribute('aria-label','播放導覽')};
  outro.onplay=()=>{play.textContent='Ⅱ';play.setAttribute('aria-label','暫停導覽')};
  outro.onpause=()=>{play.textContent='▶';play.setAttribute('aria-label','播放導覽')};
  audio.onloadedmetadata=()=>update(0);
  outro.onloadedmetadata=()=>update(0);
  audio.ontimeupdate=()=>{if(phase==='main')update(audio.currentTime)};
  outro.ontimeupdate=()=>{if(phase==='outro')update(audio.duration+outro.currentTime)};
  audio.onended=async()=>{phase='outro';outro.currentTime=0;await outro.play()};
  outro.onended=()=>{update(duration());sub.textContent='以上是系所補助方案的介紹，感謝您的聆聽。'};
  </script>
</body>
</html>
