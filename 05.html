<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>彈性薪資獎勵與 TTQS 人才發展品質管理研習｜多國語言導覽</title>
  <style>
    :root{--ink:#edf8fa;--muted:#b8ced3;--panel:rgba(8,32,39,.94);--accent:#60d5e6}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{color:var(--ink);background:radial-gradient(circle at 12% 12%,rgba(47,180,201,.22),transparent 32rem),linear-gradient(145deg,#06171c,#0a262e 54%,#07191e);font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif}.shell{min-height:100vh;padding:clamp(12px,3vw,40px);display:grid;place-items:center}.card{width:min(1180px,100%);display:grid;grid-template-columns:minmax(280px,.86fr) minmax(320px,1.14fr);gap:clamp(22px,4vw,56px);align-items:center;padding:clamp(18px,3vw,38px);border:1px solid rgba(166,230,238,.22);border-radius:26px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.38)}.poster{overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 16px 42px rgba(0,0,0,.32)}.poster img{width:100%;height:auto;display:block}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:.9rem;font-weight:700;letter-spacing:.14em}h1{margin:0;font-size:clamp(2rem,5vw,4.1rem);line-height:1.08}.language-row{margin:18px 0 6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.language-row label{color:var(--muted);font-weight:700}.language-row select{min-width:190px;padding:10px 38px 10px 13px;border:1px solid rgba(166,230,238,.45);border-radius:10px;color:var(--ink);background:#12343c;font:inherit;cursor:pointer}.intro{margin:12px 0 24px;color:var(--muted);font-size:clamp(1rem,1.5vw,1.16rem);line-height:1.7}.subtitle{min-height:7.5rem;display:grid;place-items:center;padding:20px 24px;border-left:5px solid #2fb4c9;border-radius:10px;background:rgba(255,255,255,.075);font-size:clamp(1.2rem,2.4vw,1.72rem);line-height:1.6;text-align:center}.controls{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:14px 18px;align-items:center}.play{width:62px;height:62px;border:0;border-radius:50%;color:#042027;background:var(--accent);cursor:pointer;font-size:1.4rem;box-shadow:0 8px 28px rgba(47,180,201,.3)}.play:focus-visible{outline:3px solid #fff;outline-offset:4px}.progress{display:grid;gap:7px}.progress input{width:100%;accent-color:#2fb4c9}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.86rem}.hint{grid-column:1/-1;margin:0;color:var(--muted);font-size:.88rem}@media(max-width:760px){.card{grid-template-columns:1fr;border-radius:18px}.poster{width:min(520px,100%);margin:auto}.copy{text-align:center}.language-row{justify-content:center}.subtitle{min-height:6.8rem}.controls{text-align:left}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <figure class="poster"><img src="poster-05.jpg" alt="彈性薪資獎勵與 TTQS 人才發展品質管理研習成果展板"></figure>
      <div class="copy">
        <p id="eyebrow" class="eyebrow">高等教育深耕計畫成果展 · 05</p>
        <h1 id="title">彈性薪資獎勵與 TTQS 人才發展品質管理研習</h1>
        <div class="language-row">
          <label id="languageLabel" for="language">導覽語言</label>
          <select id="language">
            <option value="zh-TW">繁體中文</option><option value="en-US">English</option><option value="es-ES">Español</option><option value="fr-FR">Français</option><option value="de-DE">Deutsch</option><option value="ja-JP">日本語</option><option value="ko-KR">한국어</option><option value="it-IT">Italiano</option><option value="pt-PT">Português</option><option value="ru-RU">Русский</option>
          </select>
        </div>
        <p id="intro" class="intro">點選播放按鈕，即可一邊觀看展板，一邊收聽導覽並閱讀同步字幕。</p>
        <div id="subtitle" class="subtitle" aria-live="polite">點選下方按鈕開始語音導覽。</div>
        <audio id="audio" preload="metadata" src="narration-05-zh-TW.mp3"></audio>
        <div class="controls">
          <button id="play" class="play" type="button" aria-label="播放導覽">▶</button>
          <div class="progress">
            <input id="seek" type="range" min="0" max="111.184" step="0.05" value="0" aria-label="導覽播放進度">
            <div class="times"><span id="now">0:00</span><span id="total">1:51</span></div>
          </div>
          <p id="hint" class="hint">若瀏覽器未自動播放聲音，請再點一次播放按鈕。</p>
        </div>
      </div>
    </section>
  </main>
  <script src="languages-05.js?v=1"></script>
  <script>
  const languages=window.GUIDE_LANGUAGES,audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),sub=document.getElementById('subtitle'),now=document.getElementById('now'),total=document.getElementById('total'),selector=document.getElementById('language');
  let config=languages['zh-TW'];
  const fmt=v=>`${Math.floor(v/60)}:${String(Math.floor(v%60)).padStart(2,'0')}`;
  const expectedDuration=()=>config.cues.at(-1)[1];
  const duration=()=>Number.isFinite(audio.duration)?audio.duration:expectedDuration();
  const update=t=>{seek.max=duration();seek.value=t;now.textContent=fmt(t);total.textContent=fmt(duration());const cue=config.cues.find(c=>t>=c[0]&&t<=c[1]);sub.textContent=cue?cue[2]:(t>=duration()?config.cues.at(-1)[2]:config.start)};
  function applyLanguage(code){audio.pause();config=languages[code];document.documentElement.lang=code;document.title=config.title+'｜Audio Guide';document.getElementById('eyebrow').textContent=config.eyebrow;document.getElementById('title').textContent=config.title;document.getElementById('languageLabel').textContent=config.language;document.getElementById('intro').textContent=config.intro;document.getElementById('hint').textContent=config.hint;sub.textContent=config.start;play.textContent='▶';play.setAttribute('aria-label',config.play);seek.setAttribute('aria-label',config.progress);seek.value=0;now.textContent='0:00';total.textContent=fmt(expectedDuration());audio.src=config.audio;audio.load()}
  selector.onchange=()=>applyLanguage(selector.value);
  play.onclick=async()=>{if(audio.ended)audio.currentTime=0;audio.paused?audio.play():audio.pause()};
  seek.oninput=()=>{audio.currentTime=Number(seek.value);update(audio.currentTime)};
  audio.onplay=()=>{play.textContent='Ⅱ';play.setAttribute('aria-label',config.pause)};
  audio.onpause=()=>{play.textContent='▶';play.setAttribute('aria-label',config.play)};
  audio.onloadedmetadata=()=>update(audio.currentTime);
  audio.ontimeupdate=()=>update(audio.currentTime);
  audio.onended=()=>{update(duration());sub.textContent=config.cues.at(-1)[2]};
  applyLanguage('zh-TW');
  </script>
</body>
</html>
