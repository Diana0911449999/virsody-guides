<script>
window.GUIDE_LANGUAGES={"zh-TW":{"label":"繁體中文","title":"邁向永續未來航道：永續教育、淨零行動與社會實踐","eyebrow":"高等教育深耕計畫成果展 · 28","intro":"點選播放按鈕，即可一邊觀看展板，一邊收聽導覽並閱讀同步字幕。","start":"點選下方按鈕開始語音導覽。","hint":"請先點選圓形播放按鈕開始語音。","play":"播放導覽","pause":"暫停導覽","progress":"導覽播放進度","language":"導覽語言","cues":["歡迎來到高等教育深耕計畫成果展。本頁介紹永續發展辦公室推動的永續教育、淨零行動與社會實踐成果。","計畫以永續教育制度化為基礎，透過永續沙龍、教師培力及課程交流，協助教師把 SDGs、淨零轉型與大學社會責任，也就是 USR，融入教學。","同時，學校建立 USR 資訊整合與跨域合作機制，透過教師社群、工作坊及議題交流，促進校地共學與跨單位協作。","在實務應用上，計畫結合 AI 與 ESG 案例，推廣淨零永續教育，讓師生理解永續議題，並能將知識轉化為具體行動。","成果也延伸至永續治理。學校持續編製永續發展報告書，並進行 THE Impact Rankings 填報與中小學碳盤查示範網站推廣，提升治理透明度與社會影響力。","本年度已辦理超過三十場教學、研習與工作坊活動，累計超過四百人次教師參與，以及超過一千六百人次學生參與。","從課堂教育、在地實踐到治理揭露，這項計畫凝聚師生力量，讓每一位參與者都能成為改變的實踐者，共同航向永續未來。感謝您的聆聽。"]},"en-US":{"label":"English","title":"Sailing Toward a Sustainable Future: Education, Net-Zero Action, and Social Practice","eyebrow":"Higher Education Sprout Project Exhibition · 28","intro":"Select play to view the poster, listen to the guide, and read synchronized subtitles.","start":"Select the button below to begin the audio guide.","hint":"Select the round play button to start.","play":"Play audio guide","pause":"Pause audio guide","progress":"Audio guide progress","language":"Guide language","cues":["Welcome to the Higher Education Sprout Project Achievement Exhibition. This page presents the Office of Sustainable Development’s work in sustainability education, net-zero action, and social practice.","The project institutionalizes sustainability education through sustainability salons, faculty development, and course exchanges. These activities help teachers integrate the Sustainable Development Goals, net-zero transition, and University Social Responsibility, or USR, into teaching.","The university also built an information-integration and cross-disciplinary collaboration mechanism for USR. Faculty communities, workshops, and issue-based exchanges connect campus learning with local communities and strengthen collaboration across units.","In practical learning, the project combines AI and ESG cases to promote net-zero education. It helps teachers and students understand sustainability challenges and turn knowledge into meaningful action.","Its impact also reaches sustainable governance. The university continues to prepare sustainability reports, submit data to the THE Impact Rankings, and promote a carbon-inventory demonstration website for primary and secondary schools.","This year, more than thirty teaching, training, and workshop activities were held, involving over four hundred faculty participations and more than one thousand six hundred student participations.","From classroom learning and local practice to transparent governance, this project brings the university community together so that every participant can help create a sustainable future. Thank you for listening."]},"ja-JP":{"label":"日本語","title":"持続可能な未来へ：持続可能教育、ネットゼロ行動、社会実践","eyebrow":"Higher Education Sprout Project Exhibition · 28","intro":"再生ボタンを押すと、展示パネルを見ながら音声ガイドと同期字幕をご利用いただけます。","start":"下のボタンを押して音声ガイドを開始してください。","hint":"丸い再生ボタンを押して開始してください。","play":"音声ガイドを再生","pause":"一時停止","progress":"音声ガイドの進行状況","language":"ガイド言語","cues":["高等教育深耕計画成果展へようこそ。このページでは、持続可能な発展オフィスによる持続可能教育、ネットゼロ行動、社会実践の成果を紹介します。","本計画は、持続可能教育の制度化を基盤としています。持続可能性サロン、教員研修、授業交流を通じて、SDGs、ネットゼロ移行、そして大学の社会的責任である USR を授業に取り入れています。","さらに、USR の情報統合と分野横断の協働体制を整備しました。教員コミュニティー、ワークショップ、テーマ別交流により、地域との共学と学内連携を深めています。","実践面では、AI と ESG の事例を活用してネットゼロ教育を推進し、教職員と学生が持続可能性の課題を理解し、具体的な行動へつなげられるよう支援しています。","成果は持続可能なガバナンスにも広がっています。持続可能性報告書の作成、THE Impact Rankings への報告、中小学校向け炭素インベントリー実証サイトの普及を継続しています。","今年度は、授業、研修、ワークショップを三十回以上実施し、教員は延べ四百人以上、学生は延べ千六百人以上が参加しました。","教室での学び、地域での実践、透明性あるガバナンスを通じて、この計画は一人ひとりを変化の担い手へと結びます。ともに持続可能な未来へ進みましょう。ご清聴ありがとうございました。"]}};
</script></body></html>
